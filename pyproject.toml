[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-insurance-cost-analytics"
version = "1.0.0"
description = "Statistical analysis and visualization of medical insurance charges"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb==2.0.1",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "plotly==7.2.0",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "streamlit==1.67.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.setuptools]
packages = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
