name: Analytics checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-and-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check python dashboard scripts tests
      - run: ruff format --check python dashboard scripts tests
      - run: python -m pytest
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - run: Rscript -e 'renv::load(); source("tests/test_r.R")'
